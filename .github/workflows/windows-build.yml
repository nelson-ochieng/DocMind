name: Windows build validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean --windowed --collect-all matplotlib --collect-all fitz --collect-all pymupdf --collect-all pytesseract --name DocMind --collect-all chromadb --collect-all onnxruntime --collect-all tokenizers --collect-all posthog desktop.py
      - shell: pwsh
        run: |
          if (!(Test-Path dist/DocMind/DocMind.exe)) { throw 'Missing executable' }
          Get-FileHash dist/DocMind/DocMind.exe -Algorithm SHA256
      - shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc DocMind.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Get-FileHash installer/DocMind-Setup.exe -Algorithm SHA256
      # Intentionally no artifact upload or release until licensing is cleared.
