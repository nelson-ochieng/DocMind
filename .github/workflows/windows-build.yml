name: Windows build validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean --windowed --collect-all matplotlib --collect-all fitz --collect-all pymupdf --collect-all pytesseract --name DocMind --collect-all chromadb --collect-all onnxruntime --collect-all tokenizers --collect-all posthog desktop.py
      - shell: pwsh
        run: |
          if (!(Test-Path dist/DocMind/DocMind.exe)) { throw 'Missing executable' }
          Get-FileHash dist/DocMind/DocMind.exe -Algorithm SHA256
      - shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc DocMind.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Get-FileHash installer/DocMind-Setup.exe -Algorithm SHA256
      - name: Package test downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-downloads | Out-Null
          Copy-Item installer/DocMind-Setup.exe test-downloads/
          Compress-Archive -Path dist/DocMind -DestinationPath test-downloads/DocMind-Portable.zip -CompressionLevel Optimal
          Get-ChildItem test-downloads -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content test-downloads/SHA256SUMS.txt -Encoding ascii
      - name: Retain restricted test artifacts
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: DocMind-Windows-4.2.0-test
          path: test-downloads/
          retention-days: 7
          if-no-files-found: error
      - name: Explain public repository restriction
        if: ${{ !github.event.repository.private }}
        shell: pwsh
        run: |
          Write-Host "::warning::Test artifacts not uploaded: repository is public. Use a private repository until redistribution licensing is cleared."
      # No automatic public releases. Private test access only pending license review.
